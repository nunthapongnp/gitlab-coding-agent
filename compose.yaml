# Per-launch compose runtime (P0-SPEC-003 / ADR 0002).
#
# Every launch sets OPERATION_ID (and therefore COMPOSE_PROJECT_NAME) via the
# host launchers (scripts/launch.sh / scripts/launch.ps1), so two launches get
# distinct compose projects and distinct per-operation workspace volumes.
#
# Role isolation invariants enforced HERE, not by prompts:
#   - the planner service mounts the workspace volume READ-ONLY and receives
#     NO GitLab token and NO Docker socket;
#   - the shared control volume (gitlab-agent-control, external) is mounted
#     into the coordinator only for lock metadata;
#   - artifacts live on a bind mount outside the product checkout.
#
# Cleanup is NEVER automatic: no `down --volumes` anywhere; retained
# workspaces/logs survive failures and successful runs alike. Manual cleanup
# is an explicit operator action (see README).

name: gitlab-agent

services:
  coordinator:
    build:
      context: .
      dockerfile: docker/Dockerfile.coordinator
    image: gitlab-agent/coordinator:${OPERATION_ID:-local}
    environment:
      # GitLab credentials stay in the coordinator (trusted side).
      GITLAB_URL: ${GITLAB_URL:-https://gitlab.com}
      GITLAB_TOKEN: ${GITLAB_TOKEN:-}
      GITLAB_GIT_USERNAME: ${GITLAB_GIT_USERNAME:-agent-bot}
      # Model endpoint: must be reachable from inside the compose network;
      # container localhost is not the host (e.g. use
      # http://host.docker.internal:11434 for a host Ollama).
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-ollama/gemma4:e4b}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-ollama}
      OPENHANDS_MAX_ITERATIONS: ${OPENHANDS_MAX_ITERATIONS:-60}
      OPENHANDS_TIMEOUT_SECONDS: ${OPENHANDS_TIMEOUT_SECONDS:-1800}
      MAX_FIX_ATTEMPTS: ${MAX_FIX_ATTEMPTS:-3}
      CHECK_TIMEOUT_SECONDS: ${CHECK_TIMEOUT_SECONDS:-1200}
      EXECUTION_MAX_RUNTIME_SECONDS: ${EXECUTION_MAX_RUNTIME_SECONDS:-7200}
      SETUP_COMMAND: ${SETUP_COMMAND:-}
      BUILD_COMMAND: ${BUILD_COMMAND:-}
      TEST_COMMAND: ${TEST_COMMAND:-}
      GIT_AUTHOR_NAME: ${GIT_AUTHOR_NAME:-agent-bot}
      GIT_AUTHOR_EMAIL: ${GIT_AUTHOR_EMAIL:-ai@agent.bot}
      # In-container runtime layout.
      WORKSPACE_ROOT: /workspace
      ARTIFACT_ROOT: /artifacts
      CONTROL_ROOT: /control
      PLANNER_WORKSPACE_MOUNT: /workspace
      # The separately started Planner Agent Server worker.
      PLANNER_AGENT_SERVER_URL: http://planner:8000
      AGENT_SERVER_API_KEY: ${AGENT_SERVER_API_KEY:-agent-server-key}
    volumes:
      - workspace:/workspace
      - gitlab-agent-control:/control
      - ${AGENT_ARTIFACT_DIR:-./agent-artifacts}:/artifacts
    depends_on:
      planner:
        condition: service_healthy
    # `docker compose run --rm coordinator <args>` appends args to the
    # entrypoint: the SAME `python main.py <args>` invocation as on the host.

  planner:
    build:
      context: .
      dockerfile: docker/Dockerfile.planner
    image: gitlab-agent/planner:${OPERATION_ID:-local}
    working_dir: /state
    environment:
      # Server session key for /api/* (internal worker credential; distinct
      # from any GitLab credential).
      OH_SESSION_API_KEYS_0: ${AGENT_SERVER_API_KEY:-agent-server-key}
      OH_SECRET_KEY: ${AGENT_SERVER_SECRET_KEY:-}
      OPENHANDS_SUPPRESS_BANNER: "1"
    volumes:
      # READ-ONLY repository mount; the coordinator prepares the fresh clone
      # at /workspace/<operation-id>/repo before the planner is used.
      - workspace:/workspace:ro
      # Deliberately ABSENT: host Docker socket, GitLab token, artifacts.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 15s

volumes:
  # Per-operation workspace volume: project-scoped, so every launch (unique
  # compose project) gets its own. Retained on failure; never auto-deleted.
  workspace:
  # Shared control volume across ALL launches on this Docker host: holds
  # active lock/ownership metadata only (Issue lock, branch lock).
  gitlab-agent-control:
    external: true
    name: gitlab-agent-control
